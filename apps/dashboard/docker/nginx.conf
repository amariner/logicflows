server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Las cabeceras de seguridad se generan al arrancar (40-config.sh): la
    # política de contenidos depende de la URL de la API y del emisor. Nginx no
    # hereda add_header en las location que definen los suyos, así que cada
    # una incluye el fichero.

    # Service worker y su manifiesto (LF-55): sin caché, para que el navegador
    # detecte enseguida una versión nueva del visor.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Iconos sin hash en el nombre: un día de caché.
    location ~ ^/(icons/|favicon\.png$) {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
    }

    # Ficheros con hash en el nombre: se pueden guardar en caché un año.
    location ~* \.(?:js|css|woff2?|png|svg)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # La configuración y la página principal se consultan siempre.
    location = /config.json {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    # Aplicación de una sola página: las rutas del visor sirven index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
