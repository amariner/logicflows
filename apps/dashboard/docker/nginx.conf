# Registro de accesos en JSON, como el resto de aplicaciones (ADR-0013):
# Railway lo interpreta y permite filtrar por campo (@status:404). El registro
# de errores de nginx no admite formato y sigue siendo texto.
log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"level":"info",'
    '"service":"dashboard",'
    '"msg":"$request_method $uri $status",'
    '"req":{"method":"$request_method","url":"$uri","userAgent":"$http_user_agent"},'
    '"res":{"statusCode":$status,"bytes":$body_bytes_sent},'
    '"responseTime":$request_time'
'}';

server {
    listen 8080;
    access_log /var/log/nginx/access.log json;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Compresión (LF-59): los ficheros del visor llegan ya comprimidos en la
    # imagen (.gz) y se sirven tal cual; el resto se comprime al vuelo.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Las cabeceras de seguridad se generan al arrancar (40-config.sh): la
    # política de contenidos depende de la URL de la API y del emisor. Nginx no
    # hereda add_header en las location que definen los suyos, así que cada
    # una incluye el fichero.

    # Service worker y su manifiesto (LF-55): sin caché, para que el navegador
    # detecte enseguida una versión nueva del visor.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Iconos sin hash en el nombre: un día de caché.
    location ~ ^/(icons/|favicon\.png$) {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
    }

    # Ficheros con hash en el nombre: se pueden guardar en caché un año.
    location ~* \.(?:js|css|woff2?|png|svg)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # La configuración y la página principal se consultan siempre.
    location = /config.json {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    # Aplicación de una sola página: las rutas del visor sirven index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
