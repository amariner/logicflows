<app-page-header title="Células" [connection]="connection()">
  <ion-menu-button headerStart aria-label="Abrir el menú" />
  <app-emergency-banner [cells]="cells()" />
</app-page-header>

<ion-content class="ion-padding">
  <!-- Región enfocable: permite desplazar el contenido con el teclado (WCAG 2.1.1). -->
  <section class="cells" tabindex="0" aria-label="Células">
    <app-cell-list [cells]="cells()" [today]="today()" />
  </section>
</ion-content>
