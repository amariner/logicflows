<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir el menú" />
    </ion-buttons>
    <ion-title>Células</ion-title>
    <ion-buttons slot="end">
      <app-connection-status [state]="connection()" />
    </ion-buttons>
  </ion-toolbar>
  <app-emergency-banner [cells]="cells()" />
</ion-header>

<ion-content class="ion-padding">
  <!-- Región enfocable: permite desplazar el contenido con el teclado (WCAG 2.1.1). -->
  <section class="cells" tabindex="0" aria-label="Células">
    <app-cell-list [cells]="cells()" [today]="today()" />
  </section>
</ion-content>
