@let kpi = indicators();
<div class="indicators" [class.stale]="stale()">
  <p class="counter">
    <span class="value" data-testid="boxes">{{ kpi.boxes }}</span>
    <span class="unit">cajas</span>
  </p>

  <div class="grid">
    <app-indicator label="Palés" testId="pallets" [value]="kpi.pallets" />
    <app-indicator label="Capa" testId="layer" [value]="kpi.layer" />
    <app-indicator
      label="Ritmo"
      testId="throughput"
      [value]="kpi.throughput.value"
      [unit]="kpi.throughput.unit"
    />
    <app-indicator
      label="Ciclo"
      testId="cycle-time"
      [value]="kpi.cycleTime.value"
      [unit]="kpi.cycleTime.unit"
    />
  </div>

  <ion-progress-bar
    [value]="kpi.palletProgress"
    [attr.aria-label]="kpi.palletProgressLabel"
    data-testid="pallet-progress"
  />
</div>
