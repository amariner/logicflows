# Entorno local de LogicFlows.
# Infraestructura (broker MQTT, base de datos y proveedor de identidad):
#   pnpm infra:up · pnpm infra:down · pnpm infra:reset
# Sistema completo con las imágenes de las aplicaciones (perfil "apps"):
#   pnpm stack:up · pnpm stack:down
name: logicflows

services:
  # Broker MQTT: la misma imagen que en producción, con la configuración de
  # infra/mosquitto incluida (ADR-0010).
  mosquitto:
    build: { context: ., target: broker }
    image: logicflows-broker:local
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?Define MQTT_API_PASSWORD en .env}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?Define MQTT_SIMULATOR_PASSWORD en .env}
    ports:
      # Solo accesible desde el propio equipo.
      - '127.0.0.1:${MQTT_PORT:-1883}:1883'
      # MQTT sobre WebSocket (ADR-0008).
      - '127.0.0.1:${MQTT_WS_PORT:-9001}:9001'
    volumes:
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Proveedor de identidad OpenID Connect (ADR-0009). Modo desarrollo con el
  # realm de infra/keycloak, que incluye usuarios de prueba.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Define KEYCLOAK_ADMIN_USERNAME en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en .env}
      # Dirección pública: el emisor de los tokens es la que ve el navegador.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      # Las peticiones internas (claves públicas para la API) usan keycloak:8080.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8180}:8080'
    volumes:
      - ./infra/keycloak/realm-logicflows.json:/opt/keycloak/data/import/realm-logicflows.json:ro
      # Tema de inicio de sesión (LF-108), con los tokens y las fuentes del
      # paquete de diseño: en la imagen se copian al construirla. La carpeta del
      # tema no es de solo lectura para que Docker pueda montar dentro.
      - ./infra/keycloak/themes/logicflows:/opt/keycloak/themes/logicflows
      - ./packages/design-tokens/tokens.css:/opt/keycloak/themes/logicflows/login/resources/css/tokens.css:ro
      - ./packages/design-tokens/node_modules/@fontsource/inter/files:/opt/keycloak/themes/logicflows/login/resources/fonts:ro
    healthcheck:
      # La imagen no incluye curl: se consulta el puerto de gestión con bash.
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Aplicaciones (perfil "apps"). Se construyen con el Dockerfile de la raíz.
  api:
    profiles: [apps]
    build: { context: ., target: api }
    image: logicflows-api:local
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:${DASHBOARD_PORT:-8100}
      AUTH_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/logicflows
      AUTH_JWKS_URL: http://keycloak:8080/realms/logicflows/protocol/openid-connect/certs
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?Define REALTIME_TICKET_SECRET en .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      mosquitto: { condition: service_healthy }
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    restart: unless-stopped

  simulator:
    profiles: [apps]
    build: { context: ., target: simulator }
    image: logicflows-simulator:local
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
      SIMULATOR_SITE_ID: ${SIMULATOR_SITE_ID:-demo}
      SIMULATOR_CELL_ID: ${SIMULATOR_CELL_ID:-cell-01}
      SIMULATOR_SCENARIO: ${SIMULATOR_SCENARIO:-normal}
      SIMULATOR_BOX_INTERVAL_MS: ${SIMULATOR_BOX_INTERVAL_MS:-4000}
      SIMULATOR_CYCLE_VARIATION: ${SIMULATOR_CYCLE_VARIATION:-0.1}
      SIMULATOR_PALLET_CHANGE_MS: ${SIMULATOR_PALLET_CHANGE_MS:-8000}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-}
      SIMULATOR_FAULT_RECOVERY_MS: ${SIMULATOR_FAULT_RECOVERY_MS:-20000}
      SIMULATOR_EMERGENCY_STOP_RECOVERY_MS: ${SIMULATOR_EMERGENCY_STOP_RECOVERY_MS:-30000}
      SIMULATOR_RESTART_DELAY_MS: ${SIMULATOR_RESTART_DELAY_MS:-5000}
      SIMULATOR_STARTUP_DURATION_MS: ${SIMULATOR_STARTUP_DURATION_MS:-3000}
      SIMULATOR_LAYERS_PER_PALLET: ${SIMULATOR_LAYERS_PER_PALLET:-5}
      SIMULATOR_BOXES_PER_LAYER: ${SIMULATOR_BOXES_PER_LAYER:-8}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mosquitto: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    profiles: [apps]
    build: { context: ., target: dashboard }
    image: logicflows-dashboard:local
    environment:
      # URL de la API vista desde el navegador, no desde la red de Docker.
      API_URL: http://localhost:${API_PORT:-3000}
      AUTH_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/logicflows
      AUTH_CLIENT_ID: logicflows-visor
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-8100}:8080'
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mosquitto-data:
  postgres-data:
