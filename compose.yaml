# Entorno local de LogicFlows.
# Infraestructura (broker MQTT y base de datos):
#   pnpm infra:up · pnpm infra:down · pnpm infra:reset
# Sistema completo con las imágenes de las aplicaciones (perfil "apps"):
#   pnpm stack:up · pnpm stack:down
name: logicflows

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    command: ['/bin/sh', '/mosquitto/init/init.sh']
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?Define MQTT_API_PASSWORD en .env}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?Define MQTT_SIMULATOR_PASSWORD en .env}
    ports:
      # Solo accesible desde el propio equipo.
      - '127.0.0.1:${MQTT_PORT:-1883}:1883'
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/init.sh:/mosquitto/init/init.sh:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mosquitto_sub -h localhost -u api -P "$$MQTT_API_PASSWORD" -t ''$$SYS/broker/uptime'' -C 1 -W 3',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Aplicaciones (perfil "apps"). Se construyen con el Dockerfile de la raíz.
  api:
    profiles: [apps]
    build: { context: ., target: api }
    image: logicflows-api:local
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:${DASHBOARD_PORT:-8100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      mosquitto: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  simulator:
    profiles: [apps]
    build: { context: ., target: simulator }
    image: logicflows-simulator:local
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
      SIMULATOR_SITE_ID: ${SIMULATOR_SITE_ID:-demo}
      SIMULATOR_CELL_ID: ${SIMULATOR_CELL_ID:-cell-01}
      SIMULATOR_SCENARIO: ${SIMULATOR_SCENARIO:-normal}
      SIMULATOR_BOX_INTERVAL_MS: ${SIMULATOR_BOX_INTERVAL_MS:-4000}
      SIMULATOR_CYCLE_VARIATION: ${SIMULATOR_CYCLE_VARIATION:-0.1}
      SIMULATOR_PALLET_CHANGE_MS: ${SIMULATOR_PALLET_CHANGE_MS:-8000}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-}
      SIMULATOR_FAULT_RECOVERY_MS: ${SIMULATOR_FAULT_RECOVERY_MS:-20000}
      SIMULATOR_EMERGENCY_STOP_RECOVERY_MS: ${SIMULATOR_EMERGENCY_STOP_RECOVERY_MS:-30000}
      SIMULATOR_RESTART_DELAY_MS: ${SIMULATOR_RESTART_DELAY_MS:-5000}
      SIMULATOR_STARTUP_DURATION_MS: ${SIMULATOR_STARTUP_DURATION_MS:-3000}
      SIMULATOR_LAYERS_PER_PALLET: ${SIMULATOR_LAYERS_PER_PALLET:-5}
      SIMULATOR_BOXES_PER_LAYER: ${SIMULATOR_BOXES_PER_LAYER:-8}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mosquitto: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    profiles: [apps]
    build: { context: ., target: dashboard }
    image: logicflows-dashboard:local
    environment:
      # URL de la API vista desde el navegador, no desde la red de Docker.
      API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-8100}:8080'
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mosquitto-data:
  postgres-data:
