# Configuración de Eclipse Mosquitto para el entorno local (ADR-0004).

listener 1883
protocol mqtt

# MQTT sobre WebSocket para las células que se conectan desde Internet
# (ADR-0008): la plataforma termina TLS y las células usan wss://.
listener 9001
protocol websockets

# Todos los clientes se autentican. El fichero de contraseñas se genera al
# arrancar el contenedor a partir de las variables de entorno.
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

# Conserva mensajes retenidos y sesiones persistentes entre reinicios.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Mensajes que el broker guarda para un cliente desconectado con sesión
# persistente, como la API mientras se reinicia (ADR-0004, LF-90). Por defecto
# son 1 000 y el resto se descarta sin avisar: con 5 células se llenarían en
# unos 13 minutos. 50 000 cubren la hora de caducidad de la sesión de la API
# con unas 20 células (cada una publica cerca de un mensaje cada 4 s), con
# unos 30 MB de memoria en el peor caso.
max_queued_messages 50000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
