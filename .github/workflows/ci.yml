name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Una nueva ejecución en la misma rama cancela la anterior, que ya no aporta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Comprobaciones
    runs-on: ubuntu-24.04
    # Límite acordado para la duración de la CI (ADR-0001).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Instala la versión de pnpm declarada en packageManager y guarda en
      # caché su almacén de paquetes según el lockfile.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # pnpm descarga la versión de Node.js declarada en devEngines.runtime.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      # Falla con vulnerabilidades conocidas de severidad alta o crítica en
      # cualquier dependencia (LF-52).
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Integración
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Testcontainers levanta Mosquitto y PostgreSQL reales con Docker.
      - name: Pruebas de integración
        run: pnpm test:integration

  accessibility:
    name: Accesibilidad
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm --filter @logicflows/dashboard exec playwright install --with-deps chromium

      # axe-core comprueba WCAG 2.2 AA en tema claro y oscuro y en escritorio,
      # tableta y móvil, con la build de producción del visor.
      - name: Comprobar la accesibilidad del visor
        run: pnpm --filter @logicflows/dashboard test:a11y

  system:
    name: Sistema completo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Construye las imágenes de las aplicaciones (Dockerfile de la raíz) y
      # levanta el sistema completo con la configuración de ejemplo
      # (escenario normal del simulador, sin incidencias).
      - name: Construir las imágenes y levantar el sistema
        run: |
          cp .env.example .env
          docker compose --profile apps up -d --build --wait

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm --filter @logicflows/dashboard exec playwright install --with-deps chromium

      - name: Comprobar los servicios publicados
        run: |
          curl -fsS http://127.0.0.1:3000/health/ready
          curl -fsS http://127.0.0.1:8100/config.json | grep -q '"apiUrl": "http://localhost:3000"'
          curl -fsSI http://127.0.0.1:8100/ | grep -qi "content-security-policy: default-src 'self'"
          curl -fsSI http://127.0.0.1:3000/health/live | grep -qi "content-security-policy: default-src 'none'"
          main=$(curl -fsS http://127.0.0.1:8100/ | grep -o 'main-[A-Za-z0-9]*\.js' | head -1)
          curl -fsSI -H 'Accept-Encoding: gzip' "http://127.0.0.1:8100/$main" | grep -qi 'content-encoding: gzip'

      # Una caja publicada por el simulador llega al visor a través del broker,
      # la API y el canal en tiempo real.
      - name: Prueba de extremo a extremo
        run: pnpm test:e2e

      - name: Trazas de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trazas-extremo-a-extremo
          path: apps/dashboard/test-results/
          retention-days: 7

      - name: Tamaño de las imágenes
        run: docker image ls 'logicflows-*'

      - name: Estado de los servicios
        if: always()
        run: docker compose --profile apps ps

      - name: Registros si falla
        if: failure()
        run: docker compose --profile apps logs

      - name: Detener y eliminar los datos
        if: always()
        run: docker compose --profile apps down --volumes
