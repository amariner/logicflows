name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Una nueva ejecución en la misma rama cancela la anterior, que ya no aporta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Comprobaciones
    runs-on: ubuntu-24.04
    # Límite acordado para la duración de la CI (ADR-0001).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Instala la versión de pnpm declarada en packageManager y guarda en
      # caché su almacén de paquetes según el lockfile.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # pnpm descarga la versión de Node.js declarada en devEngines.runtime.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      # Falla con vulnerabilidades conocidas de severidad alta o crítica en
      # cualquier dependencia (LF-52).
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Integración
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Testcontainers levanta Mosquitto y PostgreSQL reales con Docker.
      - name: Pruebas de integración
        run: pnpm test:integration

  accessibility:
    name: Accesibilidad
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm --filter @logicflows/dashboard exec playwright install --with-deps chromium

      # axe-core comprueba WCAG 2.2 AA en tema claro y oscuro y en escritorio,
      # tableta y móvil, con la build de producción del visor.
      - name: Comprobar la accesibilidad del visor
        run: pnpm --filter @logicflows/dashboard test:a11y

  android:
    name: Android
    runs-on: ubuntu-24.04
    # Gradle descarga sus dependencias la primera vez; con la caché tarda
    # unos 2 minutos (prueba de concepto de LF-12).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # El runner trae el Android SDK; Capacitor 8 necesita JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Compila el visor, pone el config.json de la app y sincroniza el
      # proyecto Android (ADR-0002).
      - name: Sincronizar el proyecto Android
        run: pnpm --filter @logicflows/dashboard android:sync

      # cap sync reescribe las rutas a los plugins, que incluyen la versión de
      # cada uno: lo versionado debe coincidir con lo que genera.
      - name: Comprobar que la sincronización es reproducible
        run: |
          if [ -n "$(git status --porcelain apps/dashboard/android)" ]; then
            git status --porcelain apps/dashboard/android
            git diff apps/dashboard/android
            echo "::error::El proyecto Android no coincide con cap sync: ejecutar pnpm --filter @logicflows/dashboard android:sync y versionar el resultado."
            exit 1
          fi

      - name: Compilar el APK de depuración
        working-directory: apps/dashboard/android
        run: ./gradlew assembleDebug --no-daemon

      # Para probar la PR en un móvil (ADR-0014). Se firma con una clave de
      # depuración: no se instala encima de una versión publicada.
      - uses: actions/upload-artifact@v7
        with:
          name: logicflows-debug-apk
          path: apps/dashboard/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # La firma de release, con una clave desechable creada con el mismo
      # script que la de verdad (LF-67): si esto falla, fallaría la
      # publicación de la siguiente versión.
      - name: Firma de release con una clave desechable
        working-directory: apps/dashboard/android
        env:
          ANDROID_KEYSTORE_PASSWORD: clave-desechable-de-la-ci
          ANDROID_KEY_ALIAS: logicflows
          LOGICFLOWS_VERSION: 0.0.2
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/desechable.p12"
          ./crear-clave.sh "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease --no-daemon
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

  android-emulator:
    name: Android en emulador
    # Prueba el APK que compila el trabajo Android, en un emulador (LF-74).
    needs: android
    runs-on: ubuntu-24.04
    # Hasta tres intentos si Google Play Services cierra la app al arrancar.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: logicflows-debug-apk
          path: apk

      # El emulador necesita aceleración por hardware (KVM) para arrancar en
      # un tiempo razonable.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Imagen con Google Play: trae Chrome, que abre el inicio de sesión.
      - name: Probar la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          script: apps/dashboard/android/prueba-emulador.sh apk/app-debug.apk "$RUNNER_TEMP/emulador"

      - name: Registro y captura si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulador
          path: ${{ runner.temp }}/emulador
          retention-days: 7

  system:
    name: Sistema completo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Construye las imágenes de las aplicaciones y del broker (Dockerfile de
      # la raíz) y levanta el sistema completo con la configuración de ejemplo
      # (escenario normal del simulador, sin incidencias).
      - name: Construir las imágenes y levantar el sistema
        run: |
          cp .env.example .env
          docker compose --profile apps up -d --build --wait

      # Imagen de producción de Keycloak (ADR-0010): arranca contra PostgreSQL,
      # sin usuarios y con la dirección del visor de su entorno.
      - name: Proveedor de identidad en modo producción
        run: |
          docker build --target identity -t logicflows-identity:local .
          infra/keycloak/comprobar-produccion.sh

      # Variante de las previsualizaciones (ADR-0012): el usuario de la prueba
      # de extremo a extremo y nada más.
      - name: Proveedor de identidad de las previsualizaciones
        run: |
          docker build --target identity-preview -t logicflows-identity:preview .
          infra/keycloak/comprobar-previsualizacion.sh

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm --filter @logicflows/dashboard exec playwright install --with-deps chromium

      - name: Comprobar los servicios publicados
        run: |
          curl -fsS http://127.0.0.1:3000/health/ready
          curl -fsS http://127.0.0.1:8100/config.json | grep -q '"apiUrl": "http://localhost:3000"'
          curl -fsSI http://127.0.0.1:8100/ | grep -qi "content-security-policy: default-src 'self'"
          curl -fsSI http://127.0.0.1:3000/health/live | grep -qi "content-security-policy: default-src 'none'"
          main=$(curl -fsS http://127.0.0.1:8100/ | grep -o 'main-[A-Za-z0-9]*\.js' | head -1)
          curl -fsSI -H 'Accept-Encoding: gzip' "http://127.0.0.1:8100/$main" | grep -qi 'content-encoding: gzip'

      # Una caja publicada por el simulador llega al visor a través del broker,
      # la API y el canal en tiempo real.
      - name: Prueba de extremo a extremo
        run: pnpm test:e2e

      - name: Trazas de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trazas-extremo-a-extremo
          path: apps/dashboard/test-results/
          retention-days: 7

      - name: Tamaño de las imágenes
        run: docker image ls 'logicflows-*'

      - name: Estado de los servicios
        if: always()
        run: docker compose --profile apps ps

      - name: Registros si falla
        if: failure()
        run: docker compose --profile apps logs

      - name: Detener y eliminar los datos
        if: always()
        run: docker compose --profile apps down --volumes
