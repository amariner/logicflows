name: Imágenes

# Publica las imágenes de las aplicaciones en GitHub Container Registry.
# - Cada cambio en main: imágenes etiquetadas con el commit (sha-xxxxxxx) y main.
# - Cada etiqueta vX.Y.Z: la versión se asigna a las imágenes ya publicadas de
#   ese commit, sin recompilar: se promociona exactamente lo que se probó.
# Las pull requests no publican; la CI solo construye las imágenes.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publicar ${{ matrix.app }}
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, simulator, dashboard]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/logicflows-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      # La etapa de compilación se ejecuta una vez en amd64; las imágenes de
      # cada arquitectura solo copian su resultado sobre la imagen base.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  promote:
    # Nombre fijo: en las ejecuciones desde main el trabajo se omite y no se
    # resolverían las variables de la matriz.
    name: Promocionar la versión
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, simulator, dashboard]
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Si el commit de la etiqueta no se publicó desde main, falla: una
      # versión solo puede salir de imágenes ya construidas y probadas.
      - name: Etiquetar la imagen del commit con la versión
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/logicflows-${{ matrix.app }}
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          source="$IMAGE:sha-${SHA::7}"
          docker buildx imagetools inspect "$source" > /dev/null
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$source"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
