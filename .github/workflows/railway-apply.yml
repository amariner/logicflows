name: Railway apply

# Aplica en producción el plan fijado en la pull request fusionada (ADR-0011).
# Si producción cambió desde que se calculó, o lo fusionado en .railway/ no es
# lo planificado, la CLI rechaza el plan y hay que volver a planificar. Un
# cambio en .railway/ que no venga de una PR no tiene plan y no se aplica.
on:
  push:
    branches: [main]
    paths: ['.railway/**']

# Un despliegue no se cancela a medias: el siguiente espera.
concurrency:
  group: railway-apply
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  RAILWAY_CLI_VERSION: 5.55.0

jobs:
  apply:
    name: Aplicar en producción
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://dashboard-production-6f89.up.railway.app
    steps:
      - name: Comprobar los tokens de Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Falta el secreto RAILWAY_TOKEN: un token de proyecto de Railway para production (docs/despliegue.md)."
            exit 1
          fi
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Falta el secreto RAILWAY_API_TOKEN: un token de cuenta de Railway para esperar a los despliegues (docs/despliegue.md)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Instalar la CLI de Railway
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"

      # Con Rebase and merge, el commit de main no es el de la PR: se busca la
      # PR del commit y el plan de la última ejecución de su rama.
      - name: Descargar el plan de la pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "::error::El commit $SHA no viene de una pull request: no hay plan revisado que aplicar."
            exit 1
          fi
          head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
          run=$(gh run list --repo "$REPO" --workflow railway-plan.yml --commit "$head" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::La PR #$pr no tiene un plan correcto para su último commit ($head)."
            exit 1
          fi
          echo "Plan de la PR #$pr (ejecución $run)"
          gh run download "$run" --repo "$REPO" --name railway-plan

      - name: Anotar el inicio del despliegue
        id: inicio
        run: echo "desde=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_OUTPUT"

      - name: Aplicar el plan
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway config apply --plan railway-plan.json --yes --confirm-destructive

      # apply lanza los despliegues sin esperar a que terminen. El flujo solo
      # acaba bien cuando están en marcha, para que la prueba de producción
      # compruebe la versión nueva y no la anterior (LF-73). Consultar los
      # despliegues necesita el token de cuenta, como las previsualizaciones.
      - name: Esperar a que terminen los despliegues
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          DESDE: ${{ steps.inicio.outputs.desde }}
        run: infra/railway/esperar-despliegues.sh production "$DESDE" broker identity api simulator dashboard
