name: Railway plan

# Calcula los cambios que una pull request haría en producción (ADR-0011), los
# publica como comentario en la PR y fija el plan como artefacto: al fusionar,
# Railway apply aplica exactamente ese plan.
on:
  pull_request:
    branches: [main]
    paths: ['.railway/**']

concurrency:
  group: railway-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  RAILWAY_CLI_VERSION: 5.55.0

jobs:
  plan:
    name: Plan de Railway
    # Las PR desde forks no tienen acceso al token de Railway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Comprobar el token de Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Falta el secreto RAILWAY_TOKEN: un token de proyecto de Railway para production (docs/despliegue.md)."
            exit 1
          fi

      - uses: actions/checkout@v7

      # La CLI evalúa .railway/railway.ts con el Node.js del sistema.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # El fichero de configuración importa el SDK de Railway (railway/iac).
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar la CLI de Railway
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"

      - name: Calcular el plan
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -o pipefail
          railway config plan --verbose --out railway-plan.json | tee plan.txt

      - uses: actions/upload-artifact@v7
        with:
          name: railway-plan
          path: railway-plan.json
          retention-days: 30

      - name: Comentar el plan en la pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Plan de Railway (producción)'
            echo
            echo 'Al fusionar, `Railway apply` aplicará exactamente estos cambios.'
            echo
            echo '```text'
            cat plan.txt
            echo '```'
          } > comentario.md
          gh pr comment "$PR" --body-file comentario.md --edit-last --create-if-none
